# Arquivo: pytest.ini
#
# Objetivo:
#   Configurar o comportamento padrão do pytest neste projeto.
#
# Por que este arquivo existe:
#   Sem o pytest.ini, seria necessário passar várias opções manualmente
#   toda vez que os testes fossem executados no terminal.
#
# Neste projeto, ele define:
#   1. Onde o pytest deve procurar os testes automatizados.
#   2. Que a raiz do projeto deve entrar no caminho de importação do Python.
#   3. Que os logs devem aparecer durante a execução dos testes.
#   4. O formato das mensagens de log exibidas no terminal.
#
# Importante:
#   Este arquivo não executa testes sozinho.
#   Ele apenas orienta o pytest quando você roda comandos como:
#
#       pytest
#       pytest -v
#
# Diferença entre testes manuais e automatizados:
#   Os testes manuais ficam em tests/manuais e são executados diretamente
#   com python.
#
#   Os testes automatizados ficam em tests/automatizados e são executados
#   com pytest.

[pytest]
testpaths = tests/automatizados
pythonpath = .
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Deixar log guardado:

log_file = logs/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S